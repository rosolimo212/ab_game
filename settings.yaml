# Публичные настройки приложения (этот файл — единственный yaml в git).
# Параметры Postgres (host/port/user/password/…) и logging_enabled:true —
# только в локальном secrets.yaml (не коммитить; образец в AGENTS.md / README).
#
# БД communication — одно имя на stage и prod.
# Схема ab_game; данные разделены разными серверами postgres.

app:
  # MVP: только streamlit (telegram/console — позже)
  interface: streamlit
  # По умолчанию false (клон без secrets). Включить запись в PG —
  # app.logging_enabled: true + секция logging в secrets.yaml.
  logging_enabled: false

game:
  # Базовая доля метрики (генеральная совокупность / ветка A)
  base_p: 0.1
  # Относительный шум дневной истинной доли: p_day ~= base_p * (1 + N(0, noise)), клип в [0, 1]
  noise: 0.05
  # Знаменатель (trials) на один день в каждой ветке
  n_per_day: 200
  # Число дней (точек на графике)
  n_days: 14
  # Вероятность, что у ветки B будет сдвиг p относительно базы
  effect_probability: 0.5
  # Относительный диапазон сдвига: Uniform(-range, +range) * base_p
  effect_relative_range: 0.2
  # Раундов в одной сессии
  rounds_per_session: 20
  # Порог значимости z-теста
  alpha: 0.05

# Публичный инвариант имени схемы. Host/port/user/password — в secrets.yaml.
logging:
  schema: ab_game
