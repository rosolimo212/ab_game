# /etc/nginx/sites-available/ab-game
# Субдомен: ab.kotelok.space → 127.0.0.1:8503
#
# Установка:
#   cp deploy/nginx-ab-game.conf /etc/nginx/sites-available/ab-game
#   ln -sf /etc/nginx/sites-available/ab-game /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ab.kotelok.space

server {
    listen 80;
    server_name ab.kotelok.space;

    location / {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
